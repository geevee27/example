steps:
  - label: ":go: Build"
    command: "go build -o hello-app ./hello"
    plugins:
      - docker#v5.11.0:
          image: "golang:1.15"
    artifact_paths:
      - "hello-app"

  - wait

  - label: ":rocket: Run"
    command: "./hello-app Buildkite"
    depends_on: ~
    plugins:
      - artifacts#v1.9.4:
          download: "hello-app"
      - docker#v5.11.0:
          image: "golang:1.15"
